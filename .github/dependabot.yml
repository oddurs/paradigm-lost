version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ['next', 'react', 'react-dom', '@types/react*']
      stylex:
        patterns: ['@stylexjs/*', '@stylexswc/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
